<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>QuestPorts share image</title>
  <style>
    @font-face {
      font-family: Inter;
      src: url("file:///usr/share/fonts/truetype/macos/Inter-Medium.ttf") format("truetype");
      font-weight: 500;
      font-style: normal;
    }
    @font-face {
      font-family: Inter;
      src: url("file:///usr/share/fonts/truetype/macos/Inter-SemiBold.ttf") format("truetype");
      font-weight: 600;
      font-style: normal;
    }
    @font-face {
      font-family: Inter;
      src: url("file:///usr/share/fonts/truetype/macos/Inter-Bold.ttf") format("truetype");
      font-weight: 700;
      font-style: normal;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #080d1a;
      font-family: Inter, sans-serif;
      color: #fff;
    }

    body {
      background:
        radial-gradient(ellipse 680px 520px at 12% 8%, rgba(6, 182, 212, 0.22), transparent 68%),
        radial-gradient(ellipse 640px 520px at 92% 108%, rgba(59, 130, 246, 0.20), transparent 70%),
        radial-gradient(ellipse 420px 360px at 70% 18%, rgba(99, 102, 241, 0.12), transparent 72%),
        #080d1a;
    }

    .grid-overlay {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(to right, rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 40px 40px;
      mask-image: radial-gradient(ellipse 90% 80% at 40% 50%, #000 30%, transparent 80%);
    }

    .canvas {
      position: relative;
      z-index: 1;
      width: 1200px;
      height: 630px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 48px 40px 48px 56px;
      gap: 28px;
    }

    .copy {
      width: 600px;
      flex: 0 0 600px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand svg {
      width: 52px;
      height: 36px;
      filter: drop-shadow(0 0 14px rgba(6, 182, 212, 0.55));
    }

    .brand-name {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1;
    }

    .brand-name span { color: #38bdf8; }

    .chip {
      display: inline-flex;
      align-items: center;
      margin-top: 26px;
      padding: 8px 14px 8px 12px;
      border-radius: 999px;
      background: rgba(16, 185, 129, 0.14);
      border: 1px solid rgba(52, 211, 153, 0.55);
      color: #a7f3d0;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1;
    }

    .chip i {
      width: 8px;
      height: 8px;
      margin-right: 10px;
      border-radius: 999px;
      background: #34d399;
      box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.18);
    }

    h1 {
      margin-top: 26px;
      font-size: 68px;
      font-weight: 700;
      letter-spacing: -0.04em;
      line-height: 0.96;
      color: #fff;
    }

    h1 span { display: block; }

    h1 .accent { color: #22d3ee; }

    .sub {
      margin-top: 28px;
      max-width: 580px;
      font-size: 24px;
      font-weight: 600;
      line-height: 1.35;
      letter-spacing: -0.015em;
      color: #e2e8f0;
    }

    .covers {
      width: 500px;
      flex: 0 0 500px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .covers img {
      width: 100%;
      aspect-ratio: 460 / 215;
      object-fit: cover;
      object-position: center;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.45);
      background: #111827;
    }
  </style>
</head>
<body>
  <div class="grid-overlay"></div>
  <div class="canvas">
    <div class="copy">
      <div class="brand">
        <svg viewBox="0 0 388 268" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
          <defs>
            <linearGradient id="qp-top" x1="40" y1="70" x2="305" y2="70" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#00d4ff" />
              <stop offset="25%" stop-color="#05a6ff" />
              <stop offset="65%" stop-color="#016dff" />
              <stop offset="100%" stop-color="#293aff" />
            </linearGradient>
            <linearGradient id="qp-bot" x1="75" y1="190" x2="350" y2="190" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#1d3aff" />
              <stop offset="30%" stop-color="#3862ff" />
              <stop offset="65%" stop-color="#637eff" />
              <stop offset="90%" stop-color="#9d96ff" />
              <stop offset="100%" stop-color="#aca7ff" />
            </linearGradient>
            <linearGradient id="qp-fold" x1="300" y1="65" x2="350" y2="160" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
              <stop offset="100%" stop-color="#000000" stop-opacity="0.2" />
            </linearGradient>
          </defs>
          <path d="M 85 158 L 255 158 C 285 158, 305 140, 305 108 L 305 65 C 305 65, 340 115, 350 155 C 353 175, 348 205, 320 228 C 295 244, 260 244, 215 244 L 130 244 C 90 244, 75 220, 80 185 L 85 158 Z" fill="url(#qp-bot)" />
          <path d="M 80 185 C 55 160, 33 130, 33 90 C 33 50, 60 25, 110 25 L 245 25 C 280 25, 305 40, 305 65 L 305 108 L 135 108 C 105 108, 85 125, 85 158 L 80 185 Z" fill="url(#qp-top)" />
          <path d="M 305 65 L 305 108 L 348 160 C 342 125, 325 85, 305 65 Z" fill="url(#qp-fold)" />
          <path d="M 305 65 L 305 108" stroke="white" stroke-opacity="0.3" stroke-width="1.5" />
        </svg>
        <div class="brand-name">Quest<span>Ports</span></div>
      </div>

      <div class="chip"><i></i>Free · No SideQuest needed</div>

      <h1>
        <span>Install VR ports</span>
        <span>on Quest</span>
        <span class="accent">in one click</span>
      </h1>

      <p class="sub">Plug in your Quest · Open in Chrome or Edge · Hit Install</p>
    </div>

    <div class="covers">
      <img src="../public/covers/lambda1vr.jpg" alt="">
      <img src="../public/covers/gtasa_vr.jpg" alt="">
      <img src="../public/covers/galaxyquest.jpg" alt="">
      <img src="../public/covers/doom3quest.jpg" alt="">
      <img src="../public/covers/gothic2_vr.jpg" alt="">
      <img src="../public/covers/perfect_dark_vr.jpg" alt="">
    </div>
  </div>
</body>
</html>
