# questports-media — Cloudflare Workers static assets.
# Account comes from CLOUDFLARE_ACCOUNT_ID. Do not put API tokens in this file.
# A static-asset deploy replaces the whole set. Build with npm run media:build first.
name = "questports-media"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[assets]
directory = "./dist"
binding = "ASSETS"
html_handling = "none"
not_found_handling = "none"
run_worker_first = ["/previews/*"]
