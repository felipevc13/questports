name: Sync Port GitHub Releases

on:
  schedule:
    # Runs daily at 04:00 UTC (01:00 BRT)
    - cron: '0 4 * * *'
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab anytime

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run GitHub Releases Sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-github-stats.js
